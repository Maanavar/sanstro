# File-backed secrets overlay — SEC-1 Stage 1, §5.2/§5.3 of
# docs/SEC1_SECRET_CUSTODY_RULING.md.
#
# Layer this ON TOP of the base stack; it does not replace it:
#
#   docker compose -f docker-compose.app.yml -f docker-compose.secrets.yml up -d
#
# WHAT THIS CHANGES
#
# Without it, secrets reach the containers as `environment:` values interpolated
# from .env. That puts each value in three readable places: the .env file, the
# container config (plaintext in `docker inspect`), and /proc/<pid>/environ.
#
# With it, each secret is mounted read-only at /run/secrets/<name> and the app
# reads the file directly, via the JOTHIDAM_<FIELD>_FILE convention that
# app/core/config.py implements. Nothing re-exports the value into the
# environment on the way — doing that would put it straight back into /proc and
# throw away the containment.
#
# WHAT THIS DOES NOT CHANGE
#
# It is not encryption. A file-backed Compose secret is a bind mount, so the host
# still holds plaintext at ./secrets/<name>. What you gain is: the value leaves
# `docker inspect` and the process environment, permissions can be tightened to
# the one user that needs them, and each service is granted only the secrets it
# actually uses. You gain nothing on rotation, audit or backup — that is what
# escrow (§5.1) and eventually a managed secret manager (§7) are for.
#
# SETUP
#
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' "$JOTHIDAM_ENCRYPTION_KEY" > secrets/encryption_keys
#   printf '%s' "$JOTHIDAM_JWT_SECRET"     > secrets/jwt_secret
#   printf '%s' "$JOTHIDAM_ADMIN_API_KEY"  > secrets/admin_api_key
#   chmod 600 secrets/*
#
# `printf '%s'` rather than `echo`: a trailing newline is stripped on read
# anyway, but a file that visibly contains exactly the key is easier to verify.
# ./secrets/ is gitignored; confirm that before writing anything into it.
#
# Once a secret is file-backed, REMOVE its plain JOTHIDAM_* value from .env.
# Setting both is refused at boot when the two disagree, because there is no
# rule anyone would guess about which one wins — and for the encryption key,
# guessing wrong writes rows under a key the operator does not think is live.

secrets:
  encryption_keys:
    file: ./secrets/encryption_keys
  jwt_secret:
    file: ./secrets/jwt_secret
  admin_api_key:
    file: ./secrets/admin_api_key

services:
  api:
    # The HTTP process: authenticates requests and reads encrypted data, so it
    # is the only service that needs all three.
    secrets:
      - encryption_keys
      - jwt_secret
      - admin_api_key
    environment:
      JOTHIDAM_ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
      JOTHIDAM_JWT_SECRET_FILE: /run/secrets/jwt_secret
      JOTHIDAM_ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      # Blank the env channel explicitly. Compose merges maps rather than
      # removing keys, so the base file's entry survives unless it is
      # overwritten — and leaving a stale value there alongside a _FILE mount is
      # exactly the disagreement config.py refuses to resolve by guessing.
      JOTHIDAM_JWT_SECRET: ""
      JOTHIDAM_ADMIN_API_KEY: ""
      JOTHIDAM_ENCRYPTION_KEY: ""

  worker:
    # Scheduler only. Decrypts birth profiles for the morning push; holds no
    # auth secret at all. See the base file's JOTHIDAM_PROCESS_ROLE comment.
    secrets:
      - encryption_keys
    environment:
      JOTHIDAM_ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
      JOTHIDAM_ENCRYPTION_KEY: ""
