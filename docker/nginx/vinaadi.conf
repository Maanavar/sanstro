# TLS-terminating ingress for the Vinaadi AI stack (P1-5).
#
# The deployment this file describes is exactly one hop deep:
#
#     browser --TLS--> nginx --plaintext--> web (Next)  --> api (FastAPI)
#
# "One hop" is not a detail. Two settings encode it and both are wrong if this
# file changes shape without them:
#
#   TRUSTED_PROXY_HOPS_BEFORE_WEB=1   hops in front of *Next*
#   JOTHIDAM_TRUSTED_PROXY_COUNT=1    entries the API may trust
#
# The second one is 1 rather than 2 because Next does not append: it *replaces*
# X-Forwarded-For with the rightmost entry it is willing to vouch for, so the
# API receives a single entry — the address this nginx actually observed.
#
# Put a CDN or a cloud load balancer in front of this and the first number goes
# up by one; the second stays 1. See docs/PRODUCTION_EDGE.md.

# Rate limiting here is a crude outer bound only. The real, per-user, per-route
# limits live in app/middleware.py and app/core/*; this exists so a flood never
# reaches Python at all.
limit_req_zone $binary_remote_addr zone=vinaadi_edge:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=vinaadi_conn:10m;

upstream vinaadi_web {
    server web:3000;
    keepalive 32;
}

# Port 80 exists only to redirect and to answer the ACME challenge.
server {
    listen 80;
    listen [::]:80;
    server_name ${VINAADI_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${VINAADI_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${VINAADI_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${VINAADI_DOMAIN}/privkey.pem;

    # TLS 1.2 is kept for older Android, which is a real share of this audience.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Do not announce the nginx version to every scanner.
    server_tokens off;

    client_max_body_size 2m;
    limit_conn vinaadi_conn 64;

    # Security headers are NOT set here. The app owns them: the CSP carries a
    # per-request nonce minted in web/middleware.ts, and /widget/* needs a
    # different frame-ancestors from every other route. Adding a second
    # Content-Security-Policy at the edge would be enforced as the intersection
    # of the two and would silently break both.

    location / {
        limit_req zone=vinaadi_edge burst=60 nodelay;

        proxy_pass http://vinaadi_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # $proxy_add_x_forwarded_for appends the peer to whatever the client
        # sent. That is only safe because this is the outermost hop: the peer is
        # the real client, and the app trusts a counted number of entries from
        # the right. Behind a CDN, the counts above must go up in step.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        # Set, never passed through — this is what tells the app the browser is
        # on HTTPS, and a client-supplied value would let it lie.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # The API is reachable only through the Next proxy at /api/backend/*, which
    # strips client-supplied forwarding headers before forwarding. There is
    # deliberately no location block routing to api:8000 here, and the api
    # service publishes no host port — the audit's "do not expose the raw API
    # publicly" is enforced by both facts together, not by this comment.
}
