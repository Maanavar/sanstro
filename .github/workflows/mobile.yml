name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - "packages/shared/**"
  pull_request:
    paths:
      - "mobile/**"
      - "packages/shared/**"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check shared package (no DOM)
        run: pnpm -F @vinaadi/shared tsc --noEmit

      - name: Type-check mobile
        run: pnpm -F mobile tsc --noEmit

      - name: Lint mobile
        run: pnpm -F mobile lint

  build:
    name: EAS production build
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS build (production, all platforms)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile production --platform all --auto-submit --non-interactive
