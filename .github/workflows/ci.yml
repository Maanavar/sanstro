name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vinaadi_test
          POSTGRES_USER: slw_admin
          POSTGRES_PASSWORD: slw_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U slw_admin -d vinaadi_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      JOTHIDAM_DATABASE_URL: postgresql://slw_admin:slw_dev_password@localhost:5433/vinaadi_test
      JOTHIDAM_TEST_DB_RESET_ACK: I_UNDERSTAND_THIS_WIPES_TEST_DB
      # Throwaway Fernet key so encryption-touching tests run (test DB only — never
      # used for real data).
      JOTHIDAM_ENCRYPTION_KEY: oIE2E5GlSD8XImPyokV8q3d27MolWWwtsbokjOvVSQA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Install what production installs, in the order the Dockerfile does it.
      #
      # `pip install -e .[dev]` resolved pyproject's ranges to whatever was
      # newest that morning, so CI silently tested a dependency set nothing
      # ships: FastAPI 0.141.1 / Starlette 1.6.0 against production's pinned
      # 0.136.1 / 1.0.0. That is not academic — `route.path` differs between
      # them, so `_chart_id_routes()` in tests/test_chart_access_guard.py found
      # 0 routes instead of 53 and the ownership guard failed against a
      # combination that exists nowhere but this runner.
      - name: Install backend
        run: |
          pip install -r requirements.txt
          # The package itself, without letting pip re-resolve the pins above.
          pip install --no-deps -e .
          # Test-only tooling; deliberately absent from requirements.txt
          # because the production image has no use for it.
          pip install "pytest>=8.0,<9.0" "pytest-cov>=5.0,<7.0"
      - name: Run pytest
        run: pytest -q

  backend-lint:
    name: Backend lint (ruff) + types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        # Pin ruff so a newer release introducing rules can't silently turn the
        # lint gate red on an unrelated PR. Bump deliberately and fix findings in
        # the same PR. See REFACTOR_PLAN 2.1.
        run: pip install ruff==0.15.17 mypy
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Dependency audit (pip-audit)
        # Fail on any known advisory except the ecdsa Minerva timing issue, which
        # has no upstream fix and is off our signing path (HS256/HMAC only).
        # See the ecdsa note in requirements.txt and REFACTOR_PLAN 1.2.
        #
        # The five starlette entries are a deliberate holding position, not a
        # dismissal. Clearing them requires bumping FastAPI in the same change,
        # and that pair has already made tests/test_chart_access_guard.py pass
        # vacuously here (0 routes matched instead of 53). The guard gets fixed
        # first, then the bump. See REFACTOR_PLAN 1.3 for the ordered steps and
        # the note above `starlette` in requirements.txt.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-wj6h-64fc-37mp \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

  migrations:
    name: Alembic round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vinaadi_migrate
          POSTGRES_USER: slw_admin
          POSTGRES_PASSWORD: slw_dev_password
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U slw_admin -d vinaadi_migrate"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      JOTHIDAM_DATABASE_URL: postgresql://slw_admin:slw_dev_password@localhost:5440/vinaadi_migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Pinned, for the same reason as the backend-tests job above: a migration
      # round-trip proves nothing about production if it runs against a
      # different SQLAlchemy or Alembic than production has.
      - name: Install backend
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .
      - name: Upgrade -> downgrade -> upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    # No `working-directory: web`. This is a pnpm workspace: `web` depends on
    # `@vinaadi/shared` and `@vinaadi/design-tokens` via `workspace:*`, which
    # only resolve when the install runs from the repo root. Installing inside
    # `web/` is what npm could never do here.
    steps:
      - uses: actions/checkout@v4
      # Version comes from the root package.json `packageManager` field
      # (pnpm@11.8.0). Do not pin it here as well — two sources of truth for
      # the package manager is how CI ends up on a different pnpm to the one
      # that wrote pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11.8.0's engines require Node >=22.13. On Node 20 the install
          # dies with ERR_UNKNOWN_BUILTIN_MODULE before it reads a single
          # manifest — verified by building web/Dockerfile on node:20-slim.
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter jothidam-ai-web lint
      - name: Unit tests
        run: pnpm --filter jothidam-ai-web test -- --coverage
      - name: Build
        run: pnpm --filter jothidam-ai-web build

  web-image:
    name: Web Docker image (build and boot)
    runs-on: ubuntu-latest
    # This job has burned 4h47m on a single stalled `pnpm install` that was never
    # going to finish, and it would have run to the 6h default before anyone
    # learned anything. A hang should cost 30 minutes and a readable log, not six
    # hours and a cancellation.
    #
    # 30 is chosen to fit the Dockerfile's retry budget, not picked round: the
    # install runs at most 3 attempts x 8 minutes = 24, leaving ~6 for the base
    # image pull, `next build` and the boot check. If this cap is ever raised,
    # raise it above 24 + those, or the retry loop gets cut off mid-attempt and
    # the log stops just short of the evidence.
    timeout-minutes: 30
    # P0-5's Verify step, run somewhere with bandwidth.
    #
    # The image was unbuildable (npm + a lockfile that does not exist, and a
    # `.next/standalone` that `next.config.mjs` never produced) and the fix went
    # in unverified, because `pnpm install` inside the container makes one
    # registry request per lockfile entry — ~1442 of them — and the development
    # connection serves them at roughly one per five seconds. Five local
    # attempts ran 9, 72, 111, 183 and 95 minutes without clearing that step.
    #
    # So the check lives here instead of in someone's terminal. It also stops
    # the image rotting again: `web/Dockerfile` is not exercised by any other
    # job, which is exactly how it came to be broken in three separate ways at
    # once while every other gate stayed green.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Context is the repo root, NOT web/. This is a pnpm workspace and
      # web/package.json depends on @vinaadi/shared and @vinaadi/design-tokens
      # as `workspace:*`, which cannot resolve unless pnpm-lock.yaml,
      # pnpm-workspace.yaml and packages/ are all inside the context.
      # web/Dockerfile.dockerignore scopes it; BuildKit prefers that over the
      # root .dockerignore, which is tuned for the API image and excludes web/.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          tags: vinaadi-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A build that succeeds and a container that serves are two claims. This
      # one specifically catches the HOSTNAME trap: Docker sets HOSTNAME to the
      # container id and Next's standalone server binds to $HOSTNAME, so without
      # `ENV HOSTNAME=0.0.0.0` the container starts cleanly and then never
      # accepts a connection — a green build and a dead service.
      - name: Boot it and require a response on 3000
        run: |
          docker run -d --name web -p 3000:3000 vinaadi-web:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "served on 3000 after ${i}s"
              docker rm -f web
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never answered on 3000"
          docker logs web
          docker rm -f web
          exit 1

  design-tokens:
    name: Design token ratchet (no new color literals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pure-Node fs scan — no install needed. Fails if any web/mobile source
      # introduces a new hardcoded color literal beyond the ratchet baseline.
      # To intentionally move the line: `pnpm qa:colors:update` and commit the
      # regenerated scripts/color-literals-baseline.json.
      - name: Color literal ratchet
        run: node scripts/audit-color-literals.mjs

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Only run e2e when BASE_URL is provided (staging / preview deploy).
    # On PRs without a preview deploy the job is skipped automatically.
    if: vars.E2E_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # See the web job: pnpm 11.8.0 requires Node >=22.13.
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: web
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
