[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jothidam-ai"
version = "0.1.0"
description = "Vinaadi AI MVP 1 backend foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pyswisseph>=2.10.3.2; python_version < '3.14'",
  "swisseph-ffi>=1.0.0; python_version >= '3.14'",
  "python-jose[cryptography]>=3.3,<4.0",
  "cryptography>=42.0",
  "bcrypt>=4.1",
  "passlib[bcrypt]>=1.7,<2.0",
  "psycopg2-binary>=2.9,<3.0",
  "apscheduler>=3.10,<4.0",
  "reportlab>=4.0",
  "anthropic>=0.40,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0"
]
lint = [
  # Pinned to match CI; bump deliberately and clear new findings in the same PR.
  "ruff==0.15.17",
  "mypy>=1.11"
]
# Optional: install when running the Redis cache / rate-limit backends
# (JOTHIDAM_CACHE_BACKEND=redis or JOTHIDAM_RATE_LIMIT_BACKEND=redis). The code
# imports redis lazily and falls back to in-memory when it is absent.
redis = [
  "redis>=5.0,<6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "C:/tmp/pytest_cache"
addopts = "-ra --cov=app --cov-report=term-missing --cov-fail-under=40"
markers = [
    "no_db: pure unit tests that do not need a database connection",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "migrations/versions", "__pycache__"]

[tool.ruff.lint]
# Conservative, high-signal rule set so this can be adopted on an existing
# codebase without a noisy first run. `S` (flake8-bandit) is on as a security
# ratchet — deliberate exceptions carry an inline `# noqa: S### — reason`.
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "E501",  # line length handled by the formatter, not enforced as an error
    "B008",  # FastAPI uses function calls (Depends(...)) in argument defaults
    # UP042 (str-Enum -> enum.StrEnum) is a RUNTIME BEHAVIOUR CHANGE here, not a
    # style fix: with `class Band(str, Enum)`, str(Band.GOOD) == "Band.GOOD";
    # with StrEnum it becomes "GOOD". Six of these classes sit on the verdict
    # path (VerdictRung, Band, GateGrade, Reading, ErrorCode,
    # AuthThrottleAction), so any of them reaching an f-string, a log line, a
    # JSON body or a template changes what a user reads. If the migration is
    # ever wanted it is its own task — one enum per PR, with a grep for every
    # interpolation site. See docs/AUDIT_TRIAGE_2026-08-31.md §1.2.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts (S101), hardcoded test secrets/binds (S105-S107,
# S104), subprocess for fixtures (S603/S607), `random` for fixture data (S311),
# imports after sys.path setup (E402), and compact fixture statements (E702/E741).
"tests/*" = ["B011", "S101", "S105", "S106", "S107", "S311", "S104", "S603", "S607", "E402", "E702", "E741"]
# __init__.py files intentionally re-export names (and register SQLAlchemy models
# with Base as an import side effect) — do not flag those as unused imports.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false
check_untyped_defs = false
exclude = ["migrations/", "tests/", "\\.venv/"]

# Ratchet (REFACTOR_PLAN 2.1): tighten the security-critical modules first, then
# expand the module list outward as findings are cleared. Keep the rest of the
# tree on the lenient base config so this is incremental, not a flag-day.
[[tool.mypy.overrides]]
module = ["app.core.*", "app.api.*"]
check_untyped_defs = true
follow_imports = "normal"
